<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6d28d9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="shadowGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#5b21b6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4c1d95;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Main shape with gradient -->
  <rect x="10" y="10" width="80" height="80" rx="18" ry="18" fill="url(#logoGradient)" filter="url(#glow)"/>
  
  <!-- 3D shadow effect -->
  <rect x="82" y="10" width="8" height="80" rx="18" ry="18" fill="url(#shadowGradient)" opacity="0.6"/>
  
  <!-- Music note icon -->
  <path d="M35 30 L35 60 C35 65 30 70 25 70 C20 70 15 65 15 60 C15 55 20 50 25 50 C27 50 29 51 30 52 L30 35 L65 28 L65 55 C65 60 60 65 55 65 C50 65 45 60 45 55 C45 50 50 45 55 45 C57 45 59 46 60 47 L60 32 L35 38 Z" fill="white" opacity="0.95"/>
  
  <!-- Aurora wave effect -->
  <path d="M20 85 Q35 75 50 85 T80 85" stroke="#a78bfa" stroke-width="3" fill="none" opacity="0.4" stroke-linecap="round"/>
  <path d="M25 90 Q40 80 55 90 T85 90" stroke="#7c3aed" stroke-width="2" fill="none" opacity="0.3" stroke-linecap="round"/>
</svg>
